<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESUME</title>
  <link rel="stylesheet" href="/prac_css/이력서.css">
</head>
<body>
  
  <div class="wrapper">
    <header>
      <div>사진</div>
      <div class="info">
        <div>이성형</div>
        <div class="info-detail">
          <div>이메일: @gmail.com</div>
          <div>휴대폰: 010</div>          
          <div>주소: 서울시 용산구</div>
        </div>
      </div>
      <div>성격</div>        
    </header>

    <main>
      <div class="education">
        <div>학력사항</div>
        <div class="education-school">
          <div>미네소타 대학교 경제학과 졸업</div>
          <div>ㅇㅇ고등학교 졸업</div>
        </div>
      </div>
      <div>프로그램능력</div>
      <div class="certification">
        <div>자격증</div>
        <div class="certification-detail">
          <div>111</div>
          <div>111</div>
          <div>111</div>
        </div>
      </div>      
    </main>

    <footer>
      <div class="hobby">
        <div class="section-title">취미특기</div>
        <div class="hobby-content">
          <div class="hobby-row">
            <div class="hobby-workout">
              <div class="emoji">💪</div>
              <label>헬스운동</label>
            </div>    
            <div class="hobby-swim">
              <div class="emoji">🏊</div>
              <label>수영운동</label>
            </div>      
          </div>
          <div class="hobby-row">
            <div class="hobby-music">
              <div>🎵</div>
              <label>음악감상</label>        
            </div>
            <div class="hobby-video">
              <div class="emoji">🎬</div>
              <label>영상감상</label>
            </div> 
          </div>  
        </div>       
      </div>
      <div class="language">
        <div class="section-title">언어능력</div>
        <div class="language-content">
          <div class="language-korean">
            <label>한국어</label>
              <div class="language-bar">
                <div class="bar-fill" style="width: 98%;"></div>
              </div>
              <span class="percent">98%</span>
          </div>    
          <div class="language-english">
            <label>영어</label>
              <div class="language-bar">
                <div class="bar-fill" style="width: 70%;"></div>
              </div>
              <span class="percent">70%</span>            
          </div>    
          <div class="language-chinese">
            <label>중국어</label>
              <div class="language-bar">
                <div class="bar-fill" style="width: 15%"></div>
              </div>
              <span class="percent">15%</span>            
          </div>
          <div class="language-japanese">
            <label>일본어</label>
              <div class="language-bar">
                <div class="bar-fill" style="width: 10%"></div>
              </div>
              <span class="percent">10%</span>            
          </div>
        </div>
      </div>
      <div class="project">
        <div class="section-title">프로젝트 링크</div>         
      </div>         
    </footer>    

  </div>

</body>
</html>
